[package]
name = "desktop-tauri"
version = "2.0.0-alpha.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ClipPal desktop Tauri adapters, IPC and application lifecycle"

[features]
# `local` deliberately omits `sync`; `self-hosted` enables the open-source
# synchronization runtime and `commercial` layers commercial extensions on top.
default = ["local"]
local = []
self-hosted = ["sync"]
commercial = ["self-hosted", "commercial-extension"]
sync = ["dep:clip-sync-protocol", "dep:clip-sync-client", "dep:selfhost-app-core", "dep:async-channel", "dep:tauri-plugin-http", "dep:chrono", "dep:backon", "dep:rbatis", "dep:uuid", "dep:thiserror"]
commercial-extension = ["self-hosted", "dep:bincode"]

[dependencies]
desktop-app-core = { path = "../desktop-app-core" }
selfhost-app-core = { path = "../selfhost-app-core", optional = true }
clip-sync-client = { path = "../clip-sync-client", features = ["sqlite"], optional = true }
clip-core = { path = "../clip-core" }
clip-sync-protocol = { path = "../clip-sync-protocol", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = {workspace=true}
uuid = { workspace = true, features = ["v4"], optional = true }
rbatis = { workspace = true, optional = true }
tauri = {workspace = true , features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-http = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-clipboard-pal = { path = "../../tauri-plugin-clipboard-pal" }
clipboard-listener = { path = "../../clipboard-listener" }
base64 = { workspace = true}
directories = { workspace = true}
once_cell = { workspace = true }
log = { workspace = true }
log4rs = { workspace = true }
thiserror = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
async-channel = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
backon = { workspace = true, optional = true }

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
uuid = { workspace = true, features = ["v4"] }

# Windows API for auto-paste functionality
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading"
] }


# macOS API for auto-paste functionality
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { workspace = true }
objc = { workspace = true }
core-graphics = { workspace = true }
core-foundation = "0.10.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-updater = "2"
tauri-plugin-window-state = { workspace = true }
