[package]
name = "clip-sync-client"
version = "2.0.0-alpha.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ClipPal synchronization client primitives and transport boundary"

[features]
default = []
sqlite = ["clip-core/sqlite", "dep:rbatis", "dep:rbs"]

[dependencies]
clip-core = { path = "../clip-core", default-features = false }
clip-sync-protocol = { path = "../clip-sync-protocol" }
async-trait.workspace = true
async-channel.workspace = true
tokio.workspace = true
serde.workspace = true
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
rbatis = { workspace = true, optional = true }
rbs = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
