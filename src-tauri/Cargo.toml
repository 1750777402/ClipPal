[package]
name = "ClipPal"
version = { workspace = true }
authors = { workspace = true }
description = "ClipPal main application"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
crate-type = ["staticlib", "cdylib", "rlib"]
name = "clip_pal"

[features]
default = ["local"]
local = ["desktop-tauri/local"]
self-hosted = ["desktop-tauri/self-hosted"]
commercial = ["desktop-tauri/commercial"]
sync = ["desktop-tauri/sync"]
commercial-extension = ["desktop-tauri/commercial-extension"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
desktop-tauri = { path = "../crates/desktop-tauri", default-features = false }
tauri.workspace = true
# generate_context! 展开后的权限 JSON 依赖。
serde_json.workspace = true
tokio.workspace = true
log.workspace = true

# Tauri 的构建权限元数据只来自直接依赖；插件注册与操作仍归 desktop-tauri。
# 保留与 capabilities 对应的框架依赖，避免迁移后丢失原有 IPC 权限。
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-window-state.workspace = true
